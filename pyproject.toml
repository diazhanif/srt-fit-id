[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "srt-fit-id"
version = "0.1.0"
description = "Reflow subtitle SRT dengan batas karakter tanpa mengubah timestamp"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "srt-fit-id contributors" }]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
srt-fit-id = "srt_fit_id.core:main"

[tool.setuptools.packages.find]
where = ["src"]
